<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #0c2a52 0%, #07162d 55%, #05101f 100%);
      color: #e5eefc;
    }
    h3 {
      margin: 0 0 12px;
      color: #f4f8ff;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .scan-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .url-input {
      flex: 1;
      padding: 10px 12px;
      font-size: 13px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #f8fbff;
      outline: none;
      transition: all 0.25s ease;
    }
    .url-input::placeholder {
      color: rgba(229, 238, 252, 0.4);
    }
    .url-input:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }
    .scan-button {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scan-button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
    }
    .scan-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(56, 189, 248, 0.15);
    }
    .reanalyze-button {
      margin-top: 14px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #92a5c4;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .reanalyze-button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.15);
    }
    .reanalyze-button:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
    }
    .reanalyze-icon {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    #result {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .url-text {
      font-size: 12px;
      color: #b8c7e0;
      word-break: break-all;
      line-height: 1.4;
    }
    .loading {
      color: #92a5c4;
      font-size: 13px;
    }
    .status-line {
      font-size: 13px;
      color: #e5eefc;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 2px;
    }
    .metric {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .metric-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #f8fbff;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.03) inset;
      background: rgba(255, 255, 255, 0.04);
    }
    .metric-label {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #b8c7e0;
    }
    .metric--malicious .metric-circle {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.16);
    }
    .metric--suspicious .metric-circle {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.16);
    }
    .metric--harmless .metric-circle {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.16);
    }
    .metric--undetected .metric-circle {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.16);
    }
    .loading-circle {
      border-color: #7c8ca8;
      color: #d4ddee;
    }
    .message-card {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .metric {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .metric:hover {
      transform: translateY(-2px);
    }
    .metric-circle {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .metric:hover .metric-circle {
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15) inset, 0 0 10px currentColor;
      transform: scale(1.05);
    }
    .details-card {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }
    .details-card--malicious {
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.04);
    }
    .details-card--suspicious {
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.04);
    }
    .details-card--harmless {
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.04);
    }
    .details-card--undetected {
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.04);
    }
    .details-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #92a5c4;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      color: #e5eefc;
      text-align: left;
    }
    .details-table th {
      padding: 4px 6px;
      font-weight: 600;
      color: rgba(229, 238, 252, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .details-table td {
      padding: 6px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .details-table tr:last-child td {
      border-bottom: none;
    }
    .vendor-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
      display: inline-block;
    }
    .vendor-badge--malicious {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .vendor-badge--suspicious {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }
    .empty-state {
      padding: 12px 6px;
      text-align: center;
      color: rgba(229, 238, 252, 0.5);
      font-size: 11px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h3>VirusTotal Scanner</h3>
  
  <form id="scan-form" class="scan-form">
    <input type="text" id="url-input" class="url-input" placeholder="Paste link or type URL to scan..." required>
    <button type="submit" id="scan-button" class="scan-button">Scan</button>
  </form>

  <div id="result" class="loading">Right-click a link or enter a URL above to start a scan.</div>
  
  <script src="popup.js"></script>
</body>
</html>
